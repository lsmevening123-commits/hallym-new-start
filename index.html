```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>선배와의 만남 Q&A</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Pretendard',sans-serif;
    background:#f4f7fb;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:600px;
    background:white;
    border-radius:24px;
    padding:35px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:50px;
    margin-bottom:10px;
}

.title{
    text-align:center;
    color:#004A98;
    font-size:30px;
    font-weight:700;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-top:10px;
    margin-bottom:30px;
    line-height:1.6;
}

.label{
    font-weight:600;
    margin-bottom:8px;
    color:#333;
}

select{
    width:100%;
    padding:14px;
    border:1px solid #d9e2f1;
    border-radius:12px;
    margin-bottom:20px;
    font-size:15px;
}

textarea{
    width:100%;
    height:180px;
    resize:none;
    border:1px solid #d9e2f1;
    border-radius:12px;
    padding:15px;
    font-size:15px;
}

textarea:focus,
select:focus{
    outline:none;
    border-color:#004A98;
}

button{
    width:100%;
    margin-top:20px;
    background:#004A98;
    color:white;
    border:none;
    padding:16px;
    border-radius:12px;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
}

button:disabled{
    background:#8aa8d6;
    cursor:not-allowed;
}

.notice{
    margin-top:20px;
    text-align:center;
    color:#777;
    font-size:13px;
}

.success{
    display:none;
    margin-top:20px;
    background:#e8f5e9;
    color:#2e7d32;
    padding:15px;
    border-radius:10px;
    text-align:center;
    line-height:1.6;
}

.error{
    display:none;
    margin-top:20px;
    background:#ffebee;
    color:#c62828;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">💬</div>

    <div class="title">
        선배와의 만남
    </div>

    <div class="subtitle">
        궁금한 점을 자유롭게 남겨주세요.<br>
        익명으로 제출되며 선배 간호사들이 직접 답변합니다.
    </div>

    <div class="label">
        질문 분야
    </div>

    <select id="category">
        <option>병동 적응</option>
        <option>프리셉터</option>
        <option>인간관계</option>
        <option>커리어</option>
        <option>업무</option>
        <option>기타</option>
    </select>

    <div class="label">
        질문 내용
    </div>

    <textarea
        id="question"
        placeholder="예)

• 독립근무 전 가장 중요하게 준비한 것은 무엇인가요?

• 프리셉터와 갈등이 생기면 어떻게 대처하셨나요?

• 신규 간호사 시절 가장 힘들었던 점은 무엇이었나요?"
    ></textarea>

    <button id="submitBtn" onclick="submitQuestion()">
        질문 제출하기
    </button>

    <div id="success" class="success">
        ✅ 질문이 정상적으로 제출되었습니다.<br>
        소중한 질문 감사합니다.
    </div>

    <div id="error" class="error">
        제출 중 오류가 발생했습니다.
    </div>

    <div class="notice">
        한림대학교의료원 신입간호사 New Start 과정
    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6QdJii1TNat4nHT2uAaAyl7y2oRmVq3o",
  authDomain: "hallym-new-start.firebaseapp.com",
  projectId: "hallym-new-start",
  storageBucket: "hallym-new-start.firebasestorage.app",
  messagingSenderId: "1014412828298",
  appId: "1:1014412828298:web:bf4073b1c859329abe5773"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.submitQuestion = async () => {

    const category =
    document.getElementById("category").value;

    const question =
    document.getElementById("question").value.trim();

    if(!question){
        alert("질문을 입력해주세요.");
        return;
    }

    const btn =
    document.getElementById("submitBtn");

    btn.disabled = true;
    btn.innerText = "제출 중...";

    try{

        await addDoc(
            collection(db,"questions"),
            {
                category,
                question,
                createdAt: serverTimestamp()
            }
        );

        document.getElementById("question").value="";

        const success =
        document.getElementById("success");

        success.style.display="block";

        setTimeout(()=>{
            success.style.display="none";
        },4000);

    }catch(error){

        document.getElementById("error").style.display="block";

    }finally{

        btn.disabled = false;
        btn.innerText = "질문 제출하기";

    }
}

</script>

</body>
</html>
