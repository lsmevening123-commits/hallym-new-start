<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 화면 | 선배와의 만남 Q&A</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Pretendard',sans-serif;
    background:#f4f7fb;
    padding:30px;
}

.header{
    max-width:1000px;
    margin:0 auto 25px;
}

h1{
    color:#004A98;
    font-size:32px;
}

.sub{
    color:#666;
    margin-top:8px;
}

.count{
    margin-top:15px;
    font-weight:700;
    color:#004A98;
}

.list{
    max-width:1000px;
    margin:0 auto;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:16px;
    box-shadow:0 6px 18px rgba(0,0,0,.07);
}

.category{
    display:inline-block;
    background:#e8f1ff;
    color:#004A98;
    padding:6px 12px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    margin-bottom:12px;
}

.question{
    font-size:20px;
    line-height:1.6;
    color:#222;
    white-space:pre-wrap;
}

.time{
    margin-top:14px;
    font-size:13px;
    color:#888;
}

.empty{
    background:white;
    border-radius:18px;
    padding:40px;
    text-align:center;
    color:#777;
}
</style>
</head>

<body>

<div class="header">
    <h1>실시간 질문 현황</h1>
    <div class="sub">선배와의 만남 Q&A 관리자 화면</div>
    <div class="count" id="count">질문 0개</div>
</div>

<div class="list" id="questionList">
    <div class="empty">아직 등록된 질문이 없습니다.</div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getFirestore,
collection,
query,
orderBy,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6QdJii1TNat4nHT2uAaAyl7y2oRmVq3o",
  authDomain: "hallym-new-start.firebaseapp.com",
  projectId: "hallym-new-start",
  storageBucket: "hallym-new-start.firebasestorage.app",
  messagingSenderId: "1014412828298",
  appId: "1:1014412828298:web:bf4073b1c859329abe5773"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const q = query(
    collection(db,"questions"),
    orderBy("createdAt","desc")
);

onSnapshot(q, (snapshot) => {

    const list = document.getElementById("questionList");
    const count = document.getElementById("count");

    count.innerText = `질문 ${snapshot.size}개`;

    if(snapshot.empty){
        list.innerHTML = `<div class="empty">아직 등록된 질문이 없습니다.</div>`;
        return;
    }

    let html = "";

    snapshot.forEach((doc) => {
        const data = doc.data();

        let timeText = "";
        if(data.createdAt){
            timeText = data.createdAt.toDate().toLocaleString("ko-KR");
        }

        html += `
            <div class="card">
                <div class="category">${data.category}</div>
                <div class="question">${data.question}</div>
                <div class="time">${timeText}</div>
            </div>
        `;
    });

    list.innerHTML = html;
});

</script>

</body>
</html>
